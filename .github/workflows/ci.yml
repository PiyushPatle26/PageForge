name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build (rv64), Test and QEMU
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install RISC-V toolchain and QEMU
        run: |
          sudo apt-get update
          # libc6-dev-riscv64-cross is only Recommended by the compiler, and
          # --no-install-recommends would skip it, leaving no target headers.
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc gcc-riscv64-linux-gnu libc6-dev-riscv64-cross \
            make qemu-user qemu-user-static file

      - name: Build main binary (riscv64, static)
        run: make clean && make

      - name: Confirm the binary is RISC-V
        run: file ./pageforge | grep -q "RISC-V" && file ./pageforge

      - name: Run Unity unit tests under qemu-riscv64
        run: make test

      - name: Run standalone demo under qemu-riscv64
        run: make demo

      - name: Run main binary under qemu-riscv64
        run: make run

      - name: Confirm the binary links no libc
        run: |
          ! riscv64-linux-gnu-nm ./pageforge | grep -qE '__libc|glibc'
          echo "no libc symbols present"
