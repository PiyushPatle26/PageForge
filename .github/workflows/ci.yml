name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build (rv64), Test and QEMU
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install RISC-V toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc gcc-riscv64-linux-gnu make valgrind \
            qemu-user qemu-user-static file

      - name: Build main binary (riscv64, static)
        run: make clean && make

      - name: Confirm the binary is RISC-V
        run: file ./pageforge | grep -q "RISC-V" && file ./pageforge

      - name: Run Unity unit tests under qemu-riscv64
        run: make test

      - name: Run standalone demo under qemu-riscv64
        run: make demo

      - name: Run main binary under qemu-riscv64
        run: make run

      - name: Native build (host arch) for valgrind
        run: make clean && make ARCH=host demo

      - name: Valgrind memory check (demo, host arch)
        run: valgrind --error-exitcode=1 --leak-check=full ./demo/pageforge_demo
